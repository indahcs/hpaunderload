apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: 
  name: 115029258-burn-hpa 
  namespace: 115029258-hpa 
  labels: 
    student-id: "115029258"

spec:
  # watch and scale the deployment
  scaleTargetRef: 
    apiVersion: apps/v1
    kind: Deployment
    name: 115029258-burn
  
  minReplicas: 1
  maxReplicas: 10

  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50 #percentage
  
  behavior: 
    scaleDown: 
      stabilizationWindowSeconds: 60 #prevent rapid changes (replica flapping)