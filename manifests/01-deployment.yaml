apiVersion: apps/v1
kind: Deployment
metadata:
  name: 115029258-burn
  namespace: 115029258-hpa
  labels:
    app: 115029258-burn
    student-id: "115029258"

spec:
  replicas: 1
  selector:
    matchLabels:
      app: 115029258-burn

  template:
    metadata:
      labels:
        app: 115029258-burn
        student-id: "115029258"
    spec:
      containers:
        - name: burn-app
          image: icstyoningrum/115029258-burn:v1
          imagePullPolicy: Always
          env:
            - name: STUDENT_ID
              value: "115029258"
            - name: PORT
              value: "8080"
            - name: BURN_ITERATIONS
              value: "5000000"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "200m"
            limits:
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
